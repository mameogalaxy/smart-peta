<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="冷蔵庫の紙をゼロにする、家族のためのスマート掲示板" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>スマートピタ | 冷蔵庫の紙をゼロに</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 起動時エラー/白画面を放置せず、復旧ボタン付きで表示する（ホーム画面アプリのキャッシュ対策）
      (function () {
        function reloadFresh() {
          location.replace(location.origin + location.pathname + '?v=' + Date.now())
        }
        window.__smartpitaReload = reloadFresh
        function show(label, detail, recoverable) {
          var r = document.getElementById('root')
          if (!r || r.firstChild) return
          r.innerHTML =
            '<div style="padding:20px;font:14px/1.6 -apple-system,sans-serif;color:#0f172a">' +
            '<p style="font-weight:700;color:#b91c1c">' + label + '</p>' +
            (recoverable
              ? '<button onclick="window.__smartpitaReload()" style="display:block;width:100%;margin:12px 0;padding:12px;border:0;border-radius:12px;background:#3b82f6;color:#fff;font-weight:700;font-size:15px">最新の状態で開き直す</button>'
              : '') +
            '<pre style="white-space:pre-wrap;word-break:break-word;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;color:#334155">' +
            String(detail || '') + '</pre>' +
            '<p style="color:#64748b">直らない場合はこの内容をスクリーンショットで共有してください。</p></div>'
        }
        // 一定時間たっても画面が描画されない（白画面）場合の自動復旧導線
        setTimeout(function () {
          var r = document.getElementById('root')
          if (r && !r.firstChild) {
            show('読み込みに時間がかかっています', 'ホーム画面アプリの古いデータが残っている可能性があります。下のボタンで最新の状態に更新してください。', true)
          }
        }, 6000)
        // capture:true でリソース読み込みエラーも捕捉する
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target
            // e.error が無い = リソース(外部ファイル)の純粋な読み込み失敗
            var isResource = t && t !== window && t.tagName && !e.error
            if (isResource) {
              // アイコン/マニフェスト/画像の失敗は致命的でないので無視
              if (t.tagName === 'LINK' || t.tagName === 'IMG') return
              show(
                '読み込みエラー',
                'アプリ本体の読み込みに失敗しました（' + (t.src || t.href || t.tagName) + '）。\nキャッシュの可能性があります。',
                true,
              )
              return
            }
            // 実行時エラー（スタックを表示）
            show(
              '起動エラー',
              (e && e.message ? e.message : '') +
                '\n' +
                (e && e.error && e.error.stack ? e.error.stack : e && e.error ? String(e.error) : ''),
              true,
            )
          },
          true,
        )
        window.addEventListener('unhandledrejection', function (e) {
          var rs = e && e.reason
          show('読み込みエラー', rs && (rs.stack || rs.message) ? (rs.stack || rs.message) : String(rs), true)
        })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
