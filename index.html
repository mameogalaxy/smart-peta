<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="冷蔵庫の紙をゼロにする、家族のためのスマート掲示板" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>スマートピタ | 冷蔵庫の紙をゼロに</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 起動時エラーを白画面にせず画面に表示する（診断用フォールバック）
      (function () {
        function show(label, detail) {
          var r = document.getElementById('root')
          if (!r || r.firstChild) return
          r.innerHTML =
            '<div style="padding:20px;font:14px/1.6 -apple-system,sans-serif;color:#0f172a">' +
            '<p style="font-weight:700;color:#b91c1c">' + label + '</p>' +
            '<pre style="white-space:pre-wrap;word-break:break-word;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;color:#334155">' +
            String(detail || '') + '</pre>' +
            '<p style="color:#64748b">この内容をスクリーンショットで共有してください。</p></div>'
        }
        // capture:true でリソース読み込みエラーも捕捉する
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target
            // アイコン/マニフェスト/CSS/画像などの読み込み失敗は致命的ではないので無視
            if (t && (t.tagName === 'LINK' || t.tagName === 'IMG')) return
            if (t && t.tagName === 'SCRIPT') {
              show('読み込みエラー', 'アプリの読み込みに失敗しました。再読み込みしてください。')
              return
            }
            // 実行時エラー
            show('起動エラー', (e && e.message ? e.message : '') + '\n' + (e && e.error && e.error.stack ? e.error.stack : ''))
          },
          true,
        )
        window.addEventListener('unhandledrejection', function (e) {
          var rs = e && e.reason
          show('読み込みエラー', rs && (rs.stack || rs.message) ? (rs.stack || rs.message) : String(rs))
        })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
