name: Deploy to GitHub Pages

# 手動実行（公開準備が整ったタイミングでデプロイ）と、ブランチへの push で起動。
on:
  workflow_dispatch:
  push:
    branches:
      - claude/smart-fridge-bulletin-app-hm469p

permissions:
  contents: read
  pages: write
  id-token: write

# デプロイは途中キャンセルしない（キャンセルするとPagesが未公開状態のまま残り、
# サイト全体が「There isn't a GitHub Pages site here」404になることがあるため）。
# 連続pushは順番に最後まで実行してから次を走らせる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pagesの配信元を「GitHub Actions(ビルド成果物)」に確実に固定する。
      # legacy(ブランチ)のままだとリポジトリのソース(開発用 index.html → /src/main.tsx)が
      # 配信されてアプリが起動しないため、workflowになるまでリトライして確認する。
      - name: Ensure Pages source is GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          R="${{ github.repository }}"
          for i in 1 2 3 4 5; do
            gh api --method PUT "repos/$R/pages" -f build_type=workflow >/dev/null 2>&1 \
              || gh api --method POST "repos/$R/pages" -f build_type=workflow >/dev/null 2>&1
            BT=$(gh api "repos/$R/pages" --jq '.build_type' 2>/dev/null)
            echo "Pages build_type now: $BT (attempt $i)"
            [ "$BT" = "workflow" ] && break
            sleep 4
          done
          exit 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # JS/CSSをHTMLに全インライン化した単一ファイルで配信し、
      # 外部アセットの404による白画面を原理的に防ぐ。
      - run: npm run build:pages
      # 404.html を index.html のコピーにして、どのパスでもアプリを返す（SPAフォールバック）。
      # 家族が古い/別パスのURLを開いても 404 にならず必ずアプリが開く。
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
